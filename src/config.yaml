seed: 42

data:
  fname: Video_Games
  raw_ext: jsonl.gz

  clean_text_col: clean_text
  aspect_col: aspect

  test_size: 0.2

  # Aspect sequence length cap.
  # Value is the p-th percentile of the per-user / per-item aspect-count
  # distribution. Paper's best settings: Musical 90, Video Games 100, Yelp 75.
  aspect_length_percentile: 90

args:
  device: cuda

  # Training
  batch_size: 128
  num_epochs: 100
  lr: 0.001
  dropout: 0.1
  patience: 5
  val_ratio: 0.125

  # Model architecture
  id_dim: 128
  num_heads: 12
  cnn_filters: 100
  cnn_kernel_size: 5
  ffn_dim: 2048

  # Word2Vec
  w2v_vector_size: 300
  w2v_window: 5
  w2v_min_count: 1
