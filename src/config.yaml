seed: 42                    # fixed: train/test split, val carve, Word2Vec (same benchmark across runs)
train_seed: 42              # model init / training; change this and re-run for another run

data:
  fname: sample_Musical_Instruments
  raw_ext: jsonl.gz
  test_size: 0.2

  # Drop users/items with fewer than k interactions. Paper (full data): 5. The bundled
  # sample is review-level random (median ~1 review/user), so 5-core collapses it to 0 rows;
  # loosened to 2 so the sample exercises the full pipeline. Restore 5 for real datasets.
  k_core: 2

  # p-th percentile of per-user / per-item aspect-count distribution used as the
  # sequence length cap. Paper's best settings: Musical 90, Video Games 100, Yelp 75.
  aspect_length_percentile: 90

args:
  device: cuda

  # Training
  batch_size: 128
  num_epochs: 100
  optimizer: adam
  lr: 0.001
  dropout: 0.1
  patience: 5
  val_ratio: 0.125          # 0.125 of 80% train = 10% of full

  # Model architecture
  id_dim: 128
  num_heads: 12
  cnn_filters: 100
  cnn_kernel_size: 5
  ffn_dim: 2048

  # Word2Vec
  w2v_vector_size: 300
  w2v_window: 5
  w2v_min_count: 1
